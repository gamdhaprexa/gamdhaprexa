<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Marketing | ArtologyPlus</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #111820;
        }

        /* MAIN SECTION */

        .email-section {
            padding: 70px 4%;
            min-height: 100vh;
            background: #ffffff;
        }

        /* HEADING */

        .email-heading {
            text-align: center;
            margin-bottom: 50px;
        }

        .email-heading h1 {
            font-size: 38px;
            font-weight: 700;
            color: #111820;
            margin-bottom: 12px;
        }

        .email-heading p {
            font-size: 16px;
            color: #666666;
        }

        /* EMAIL GRID */

        .email-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 22px;
            align-items: stretch;
        }

        /* EMAIL CARD */

        .email-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 15px;
            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;

            transition: 0.3s ease;
        }

        .email-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        /* NUMBER */

        .email-card .number {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #243b67;
            margin-bottom: 12px;
        }

        /* TITLE */

        .email-card h2 {
            font-size: 19px;
            font-weight: 600;
            color: #111820;
            margin-bottom: 18px;
            min-height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* IMAGE */

        .email-card img {
            width: 100%;
            height: auto;
            aspect-ratio: 3 / 5;
            object-fit: contain;
            object-position: center;
            display: block;
            border-radius: 8px;
            background: #ffffff;
        }

        /* TABLET */

        @media (max-width: 992px) {

            .email-section {
                padding: 60px 5%;
            }

            .email-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 25px;
            }

        }

        /* MOBILE */

        @media (max-width: 600px) {

            .email-section {
                padding: 45px 5%;
            }

            .email-heading h1 {
                font-size: 28px;
            }

            .email-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .email-card {
                padding: 20px;
            }

        }

    </style>

</head>

<body>

    <section class="email-section">

        <div class="email-heading">

            <h1>Email Marketing</h1>

            <p>Creative Email Campaigns by ArtologyPlus</p>

        </div>

        <div class="email-grid">

            <!-- EMAIL 1 -->

            <div class="email-card">

                <div class="number">EMAIL 01</div>

                <h2>Welcome Email</h2>

                <img src="email1.png"
                     alt="Welcome Email">

            </div>


            <!-- EMAIL 2 -->

            <div class="email-card">

                <div class="number">EMAIL 02</div>

                <h2>Branding Promotion Email</h2>

                <img src="email2.png"
                     alt="Branding Promotion Email">

            </div>


            <!-- EMAIL 3 -->

            <div class="email-card">

                <div class="number">EMAIL 03</div>

                <h2>Branding Tips Newsletter</h2>

                <img src="email3.png"
                     alt="Branding Tips Newsletter">

            </div>


            <!-- EMAIL 4 -->

            <div class="email-card">

                <div class="number">EMAIL 04</div>

                <h2>Follow-up Email</h2>

                <img src="email4.png"
                     alt="Follow-up Email">

            </div>

        </div>

    </section>

</body>

</html>
